# The required check. Runs on the runner's preinstalled python3 and node, with no setup.
name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every skill passes validate.py
        run: |
          set -e
          for d in skills/*/ pdca-workflow/skills/*/; do
            echo "== $d"
            python3 scripts/validate.py "$d"
          done

      - name: validate.py tests
        run: cd scripts && python3 -m unittest discover -p "*_test.py"

      - name: No absolute home-directory paths in tracked files
        run: node --test scripts/*.test.mjs

      - name: Manifests parse, and every skill path they name exists
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          market = json.load(open(".claude-plugin/marketplace.json"))
          json.load(open("pdca-workflow/.claude-plugin/plugin.json"))
          missing = []
          for plugin in market["plugins"]:
              root = pathlib.Path(plugin["source"])
              if not root.is_dir():
                  missing.append(str(root))
              for skill in plugin.get("skills", []):
                  if not (root / skill / "SKILL.md").is_file():
                      missing.append(str(root / skill / "SKILL.md"))
          if missing:
              sys.exit("marketplace.json names paths that do not exist: " + ", ".join(missing))
          print("manifests OK")
          EOF
